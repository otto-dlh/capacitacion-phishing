[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# El frontend llama a /api/analizar; Netlify lo enruta a la función.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA: cualquier otra ruta sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
